name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Prepare Android project (package id, Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash tool/setup_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release APK (with retry)
        run: |
          n=0
          until flutter build apk --release; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then exit 1; fi
            sleep 20
          done

      - name: Prepare files
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/family-messenger-${TAG}.apk"
          (cd dist && sha256sum "family-messenger-${TAG}.apk" > "family-messenger-${TAG}.apk.sha256")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## پیام‌رسان خانواده

          نسخه‌ی نمایشی اپ (بدون سرور). صفحه‌ی ورود، لیست گفتگوها، چت و تنظیمات با داده‌ی نمایشی کار می‌کنند.

          ### نصب روی اندروید
          1. فایل `.apk` را دانلود کنید.
          2. روی گوشی آن را باز کنید و در صورت پرسش، نصب از این منبع را اجازه دهید.
          3. برای اطمینان از سالم بودن فایل، مقدار SHA-256 در فایل `.sha256` را با فایل دانلودشده مقایسه کنید.

          توجه: این نسخه با کلید آزمایشی (debug) امضا شده و فقط برای نصب دستی مناسب است.
          EOF
          gh release create "$TAG" \
            "dist/family-messenger-${TAG}.apk" \
            "dist/family-messenger-${TAG}.apk.sha256" \
            --title "پیام‌رسان خانواده ${TAG}" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
