name: Android CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform folder
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.family --project-name family_messenger "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/android" ./android
            sed -i 's/android:label="[^"]*"/android:label="پیام‌رسان خانواده"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Write Firebase config from secret (not stored in repo)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "GOOGLE_SERVICES_JSON secret not set; skipping"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK (with retry)
        run: |
          n=0
          until flutter build apk --release; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then exit 1; fi
            sleep 20
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
